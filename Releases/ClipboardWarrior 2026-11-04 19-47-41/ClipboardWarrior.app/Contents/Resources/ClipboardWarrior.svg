<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f3a"/>
      <stop offset="1" stop-color="#12141a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#5a6070" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5a6070" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9dce2"/>
      <stop offset="0.5" stop-color="#9aa0ac"/>
      <stop offset="1" stop-color="#6b717d"/>
    </linearGradient>
    <linearGradient id="shieldGrey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4b9c3"/>
      <stop offset="1" stop-color="#7d8390"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5303a"/>
      <stop offset="1" stop-color="#a8121c"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8e949f"/>
      <stop offset="0.5" stop-color="#f4f6f9"/>
      <stop offset="1" stop-color="#9aa0ac"/>
    </linearGradient>
    <clipPath id="shieldClip">
      <path id="shieldPath" d="M292,262 Q512,200 732,262 L732,520 Q732,680 512,812 Q292,680 292,520 Z"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="softshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>

  <!-- Shield -->
  <g filter="url(#shadow)">
    <path d="M292,262 Q512,200 732,262 L732,520 Q732,680 512,812 Q292,680 292,520 Z" fill="url(#shieldGrey)"/>
  </g>
  <g clip-path="url(#shieldClip)">
    <!-- red stripes -->
    <rect x="322" y="150" width="46" height="700" fill="url(#red)"/>
    <rect x="410" y="150" width="46" height="700" fill="url(#red)"/>
    <rect x="568" y="150" width="46" height="700" fill="url(#red)"/>
    <rect x="656" y="150" width="46" height="700" fill="url(#red)"/>

    <!-- keyboard keys -->
    <g fill="#14161c" fill-opacity="0.6" stroke="#e8eaee" stroke-opacity="0.6" stroke-width="3">
      <rect x="381" y="676" width="46" height="42" rx="9"/>
      <rect x="435" y="676" width="46" height="42" rx="9"/>
      <rect x="489" y="676" width="46" height="42" rx="9"/>
      <rect x="543" y="676" width="46" height="42" rx="9"/>
      <rect x="597" y="676" width="46" height="42" rx="9"/>
      <rect x="437" y="728" width="150" height="36" rx="9"/>
    </g>
    <!-- gloss -->
    <path d="M292,262 Q512,200 732,262 L732,400 Q512,330 292,400 Z" fill="#fff" fill-opacity="0.14"/>
  </g>
  <!-- shield rim -->
  <path d="M292,262 Q512,200 732,262 L732,520 Q732,680 512,812 Q292,680 292,520 Z" fill="none" stroke="url(#steel)" stroke-width="16" stroke-linejoin="round"/>
  <path d="M292,262 Q512,200 732,262 L732,520 Q732,680 512,812 Q292,680 292,520 Z" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="3" transform="translate(0,-1)"/>

  <!-- Clipboard clip -->
  <g filter="url(#softshadow)">
    <rect x="402" y="196" width="220" height="92" rx="22" fill="url(#steel)" stroke="#4f5560" stroke-width="5"/>
    <rect x="442" y="214" width="140" height="40" rx="20" fill="#1a1c22" stroke="#4f5560" stroke-width="4"/>
    <rect x="452" y="224" width="120" height="8" rx="4" fill="#fff" fill-opacity="0.12"/>
  </g>

  <!-- Sword -->
  <g filter="url(#shadow)">
    <path d="M512,118 L536,170 L536,500 L488,500 L488,170 Z" fill="url(#blade)" stroke="#5d636f" stroke-width="4" stroke-linejoin="round"/>
    <rect x="508" y="190" width="8" height="300" rx="4" fill="#6b717d" fill-opacity="0.55"/>
    <path d="M384,514 Q384,496 404,496 L620,496 Q640,496 640,514 L640,538 Q640,554 620,554 L404,554 Q384,554 384,538 Z" fill="url(#steel)" stroke="#4f5560" stroke-width="5"/>
    <circle cx="512" cy="525" r="15" fill="url(#red)" stroke="#6e0a12" stroke-width="3"/>
    <rect x="494" y="554" width="36" height="78" rx="8" fill="#7a0f18" stroke="#3d070c" stroke-width="4"/>
    <g stroke="#e5303a" stroke-opacity="0.6" stroke-width="4">
      <line x1="494" y1="574" x2="530" y2="585"/>
      <line x1="494" y1="594" x2="530" y2="605"/>
      <line x1="494" y1="614" x2="530" y2="625"/>
    </g>
    <circle cx="512" cy="646" r="24" fill="url(#steel)" stroke="#4f5560" stroke-width="5"/>
  </g>
</svg>
